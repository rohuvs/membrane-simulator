<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEMBRANE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==================== -->
    <!-- MAIN SCREEN -->
    <!-- ==================== -->

    <main id="main-screen" class="main-screen">

        <div class="title-area">
            <h1>MEMBRANE</h1>
            <p>A Virtual Cell Membrane Laboratory</p>
        </div>

        <div class="cell-icon">
            🧫
        </div>

        <div class="menu">

            <button id="start-button">
                START
            </button>

            <button id="lab-button">
                FREE EXPERIMENT
            </button>

            <button id="about-button">
                ABOUT
            </button>

        </div>

    </main>


    <!-- ==================== -->
    <!-- LAB SCREEN -->
    <!-- ==================== -->

    <main id="lab-screen" class="lab-screen">

        <header class="lab-header">

            <button id="back-button">
                ← BACK
            </button>

            <div>
                <h2>MEMBRANE LAB</h2>
                <p>Virtual Cell Membrane Laboratory</p>
            </div>

        </header>


        <section class="lab-area">

            <div class="outside-label">
                EXTRACELLULAR SPACE
            </div>


            <!-- CELL MEMBRANE -->

            <div class="membrane">

                <div class="lipid-row top-row">

                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>

                </div>


                <div class="membrane-core">

                    <div class="channel">

                        <div class="channel-label">
                            CHANNEL
                        </div>

                    </div>

                </div>


                <div class="lipid-row bottom-row">

                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>
                    <span>○</span>

                </div>

            </div>


            <div class="inside-label">
                INTRACELLULAR SPACE
            </div>


            <!-- MOLECULE -->

            <div id="molecule" class="molecule">
                O₂
            </div>

        </section>


        <!-- INFORMATION PANEL -->

        <aside class="info-panel">

            <h3>MOLECULE</h3>

            <div class="info-box">

                <p>
                    Type
                    <strong id="molecule-type">
                        O₂
                    </strong>
                </p>

                <p>
                    Location
                    <strong id="molecule-location">
                        OUTSIDE
                    </strong>
                </p>

                <p>
                    Concentration
                    <strong>
                        80
                    </strong>
                </p>

            </div>

        </aside>

    </main>


    <script src="script.js"></script>

</body>

</html>
